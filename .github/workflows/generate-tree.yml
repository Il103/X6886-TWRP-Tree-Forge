name: Generate and audit X6886 TWRP tree (NO BUILD)

on:
  workflow_dispatch:
    inputs:
      dump_repo:
        description: Public Android 16 dump repository
        required: true
        default: https://gitlab.com/Il103/android_dump_infinix_x6886.git
        type: string
      dump_branch:
        description: Android 16 dump branch
        required: true
        default: a16
        type: string
      output_repo:
        description: Fresh GitHub repository for the generated TWRP tree
        required: true
        default: android_device_infinix_X6886_TWRP-A16
        type: string
      output_branch:
        description: Output tree branch
        required: true
        default: twrp-14.1-a16
        type: string
      visibility:
        description: Output repository visibility
        required: true
        default: public
        type: choice
        options:
          - public
          - private
      publish:
        description: Create/update the output GitHub repository
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: x6886-tree-forge-${{ inputs.output_repo }}-${{ inputs.output_branch }}
  cancel-in-progress: false

jobs:
  generate:
    name: Fresh sources -> tree -> strict audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      DUMP_REPO: ${{ inputs.dump_repo }}
      DUMP_BRANCH: ${{ inputs.dump_branch }}
      OUTPUT_OWNER: Il103
      OUTPUT_REPO: ${{ inputs.output_repo }}
      OUTPUT_BRANCH: ${{ inputs.output_branch }}
      OUTPUT_VISIBILITY: ${{ inputs.visibility }}
      PUBLISH: ${{ inputs.publish }}
      WORK: ${{ github.workspace }}/work

    steps:
      - name: Checkout B E R U tree forge
        uses: actions/checkout@v5

      - name: Install evidence readers (not build tools)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs device-tree-compiler lz4 cpio jq binutils
          git lfs install
          git lfs version
          dtc --version
          python3 --version

      - name: Prove this workflow cannot build recovery
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '^[[:space:]]*(mka|brunch|ninja|soong_ui)([[:space:]]|$)' scripts treeforge
          echo 'Generation and validation only: no TWRP/OrangeFox source checkout, compiler, or build command.'

      - name: Generate and audit TWRP 14.1 for Android 16 stock
        shell: bash
        env:
          TREE_PUSH_TOKEN: ${{ secrets.TREE_PUSH_TOKEN }}
        run: bash scripts/run.sh

      - name: Upload generated tree and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6886-twrp-tree-and-audit
          path: |
            work/output/
            work/reports/
            work/facts.json
          if-no-files-found: error
          retention-days: 14
